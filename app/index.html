<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3d36">
  <meta name="description" content="Guía de Buenos Aires: qué ver, dónde comer, tours, excursiones, transporte, hospedaje y consejos de seguridad.">
  <title>Guía de Buenos Aires</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://upload.wikimedia.org">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view" data-i18n="saltar">Ir al contenido</a>
  <header class="topbar">
    <div class="brand">
      <a class="brand-home" href="#/" aria-label="Inicio"><span class="brand-mark" aria-hidden="true">☀</span><span class="brand-text">Guía</span></a>
      <button type="button" class="city-btn" id="city-btn" aria-haspopup="dialog" aria-label="Cambiar de ciudad"><b id="brand-city">Buenos Aires</b><i aria-hidden="true">▾</i></button>
    </div>
    <nav class="nav" aria-label="Secciones">
      <a href="#/" data-nav="inicio"><span class="nav-ico" aria-hidden="true">🏠</span><span data-i18n="nav.inicio">Inicio</span></a>
      <a href="#/explorar" data-nav="explorar"><span class="nav-ico" aria-hidden="true">🔎</span><span data-i18n="nav.explorar">Explorar</span></a>
      <a href="#/mapa" data-nav="mapa"><span class="nav-ico" aria-hidden="true">🗺️</span><span data-i18n="nav.mapa">Mapa</span></a>
      <a href="#/viaje" data-nav="viaje"><span class="nav-ico" aria-hidden="true">🧳</span><span data-i18n="nav.viaje">Mi viaje</span><i class="badge" id="fav-count" hidden></i></a>
      <a href="#/info" data-nav="info"><span class="nav-ico" aria-hidden="true">🛟</span><span data-i18n="nav.info">Info</span></a>
    </nav>
    <a class="account" id="account-btn" href="#/cuenta" aria-label="Mi cuenta" data-i18n-aria="cuenta">👤</a>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    <p data-i18n="pie.aviso">Información orientativa: precios, horarios y días de apertura cambian. Verificá antes de ir.</p>
    <p data-i18n="pie.creditos">Fotos: Wikimedia Commons · Mapas y subte: © OpenStreetMap · Clima: Open-Meteo · Cotización: open.er-api.com</p>
  </footer>

  <div class="sheet-wrap" id="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/ciudades.js"></script>
  <script src="js/ciudad.js"></script>
  <script src="config.js"></script>
  <script src="i18n/es.js"></script>
  <script src="i18n/en.js"></script>
  <script src="i18n/pt.js"></script>
  <script src="i18n/fr.js"></script>
  <script src="i18n/it.js"></script>
  <script src="i18n/de.js"></script>
  <script src="i18n/zh.js"></script>
  <script src="i18n/ja.js"></script>
  <script src="i18n/i18n.js"></script>
  <script src="i18n/traductor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
