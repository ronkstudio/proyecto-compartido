<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ilustraciones</title>
<!-- Hoja para revisar a ojo las ilustraciones de los lugares sin foto (tarjeta #235). No se publica (los zz-* quedan afuera). -->
<style>
  body { margin: 16px; font: 13px system-ui, sans-serif; background: #f4f1ea; color: #222; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); gap: 14px; }
  .c { border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .m { position: relative; height: 132px; color: #fff; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 70%, #0b1118), color-mix(in srgb, var(--c) 44%, #0b1118)); }
  .m svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .t { display: flex; gap: 10px; padding: 8px; align-items: center; }
  .t .m { width: 88px; height: 112px; border-radius: 12px; flex: none; }
  b { display: block; padding: 8px 10px; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script src="js/ilustraciones.js"></script>
<script>
  const colores = ["#2f7fd1", "#d1552f", "#8a4fd1", "#1f9d8a", "#3a9a3f", "#c58a12", "#b0306a", "#5b6b7c"];
  document.getElementById("g").innerHTML = window.ILUS.nombres.map((n, i) =>
    '<div class="c"><div class="m" style="--c:' + colores[i % colores.length] + '">' + window.ILUS.svg(n) + '</div><b>' + n + '</b>' +
    '<div class="t"><div class="m" style="--c:' + colores[(i + 3) % colores.length] + '">' + window.ILUS.svg(n) + '</div><span>miniatura</span></div></div>').join("");
</script>
</body>
</html>
