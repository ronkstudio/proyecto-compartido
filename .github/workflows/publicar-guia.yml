# Publica la guía (carpeta app/) en https://ronkstudio.github.io/proyecto-compartido/ (tarjeta #105).
#
# Cuándo corre:
#   - cada vez que se suma un cambio de app/ o herramientas/ a main (sumar a main lo decide una persona);
#   - dos veces por día, para traer la agenda de "Hoy" de cada ciudad;
#   - a mano, desde la pestaña Actions > "Publicar la guía" > Run workflow.
#
# Qué hace: baja la agenda del día de Buenos Aires y de Berlín (si una falla, se usa la que está en el repositorio),
# copia app/ sin los documentos internos y la publica. No cambia nada en el repositorio.
# No necesita claves: usa el permiso que GitHub le da a cada repositorio para publicar su propia página.
# Ojo: GitHub apaga los pasos programados de un repositorio que pasa 60 días sin cambios hechos por una persona.
name: Publicar la guía
on:
  push:
    branches: [main]
    paths: ["app/**", "herramientas/**", ".github/workflows/publicar-guia.yml"]
  schedule:
    - cron: "0 9 * * *"    # 6 de la mañana en Buenos Aires, 10 u 11 en Berlín
    - cron: "0 18 * * *"   # 3 de la tarde en Buenos Aires, 19 o 20 en Berlín
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bajar la agenda de Buenos Aires
        continue-on-error: true
        shell: pwsh
        run: ./herramientas/armar-hoy.ps1 -out app/data/hoy.json
      - name: Bajar la agenda de Berlín
        continue-on-error: true
        shell: pwsh
        run: ./herramientas/armar-hoy-berlin.ps1 -out app/data/hoy-berlin.json
      - name: Armar la copia para publicar (sin documentos internos)
        run: |
          mkdir _site
          cp -r app/. _site/
          rm -rf _site/i18n/fuentes _site/servir.ps1 _site/zz-*
          rm -f _site/*.md
          touch _site/.nojekyll
      # Cuentas de usuario (tarjeta #140): los dos datos de Supabase se cargan en GitHub, en Settings > Secrets and variables >
      # Actions > Variables (SUPABASE_URL y SUPABASE_ANON_KEY), y no en el repositorio. Acá se escriben solo en la copia que se publica.
      # Si no están cargados, las cuentas quedan apagadas y la guía funciona igual. Ver app/CUENTAS.md.
      - name: Encender las cuentas (si los datos están cargados en GitHub)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            # Si la dirección se pegó con un pedazo de más (por ejemplo ".../rest/v1/"), se deja solo "https://xxxx.supabase.co".
            SUPABASE_URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed -E 's#^(https://[^/]+).*#\1#')
            SUPABASE_ANON_KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
            printf 'window.GUIA_CONFIG = { supabaseUrl: "%s", supabaseAnonKey: "%s" };\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > _site/config.js
            echo "Cuentas encendidas."
          else
            echo "Cuentas apagadas: faltan SUPABASE_URL o SUPABASE_ANON_KEY en las variables del repositorio."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
