<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Galáctico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;600;700&family=Unbounded:wght@300;500&display=swap">
<style>
/* Diseño: mapa a pantalla completa sobre un cielo con estrellas. Nombre arriba a la izquierda, coordenadas abajo a la izquierda, zoom abajo a la derecha. */
:root {
  --space: #030a24;          /* fondo: azul casi negro */
  --space-mid: #0b2066;      /* azul galáctico */
  --nebula: #2b5cff;         /* brillo azul de la nebulosa */
  --violet: #5a2fd8;         /* toque violeta */
  --ink: #eef3ff;            /* texto */
  --ink-dim: #93a6dd;        /* texto secundario */
  --line: #ffffff;           /* fronteras de los continentes */
  --land-rgb: 74 132 255;    /* relleno de los continentes */
  --glow-rgb: 120 172 255;   /* halo del continente elegido */
  --under: #061650;          /* base del continente agrandado */
  --font-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --edge-l: max(16px, env(safe-area-inset-left, 0px));
  --edge-r: max(16px, env(safe-area-inset-right, 0px));
  --edge-t: calc(env(safe-area-inset-top, 0px) + 16px);
  --edge-b: calc(env(safe-area-inset-bottom, 0px) + 16px);
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  color: var(--ink);
  font-family: var(--font-body);
  background:
    radial-gradient(70vmax 50vmax at 16% 10%, color-mix(in srgb, var(--nebula) 30%, transparent), transparent 62%),
    radial-gradient(60vmax 45vmax at 88% 88%, color-mix(in srgb, var(--violet) 26%, transparent), transparent 60%),
    radial-gradient(55vmax 40vmax at 55% 45%, color-mix(in srgb, var(--space-mid) 70%, transparent), transparent 72%),
    var(--space);
  -webkit-font-smoothing: antialiased;
}
.stage { position: fixed; inset: 0; }
.stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, color-mix(in srgb, var(--space) 70%, transparent) 100%);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#map { cursor: grab; touch-action: none; opacity: 0; transition: opacity 1.1s ease; outline: none; }
#map.ready { opacity: 1; }
#map.dragging { cursor: grabbing; }
#map:focus-visible { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--line) 55%, transparent); }

.label {
  position: absolute; left: 0; top: 0; z-index: 2;
  display: grid; justify-items: center; gap: 6px;
  pointer-events: none; text-align: center; white-space: nowrap;
  will-change: transform; transition: opacity .28s ease;
}
.label.out { opacity: 0; }
.label-name {
  font-family: var(--font-display); font-weight: 300;
  font-size: clamp(20px, 3.4vw, 40px); letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink);
  text-shadow: 0 0 22px color-mix(in srgb, var(--nebula) 90%, transparent), 0 0 2px var(--space);
}
.label-meta {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-dim); text-shadow: 0 0 6px var(--space);
}

.brand {
  position: fixed; z-index: 3; top: var(--edge-t); left: var(--edge-l);
  display: grid; gap: 6px; pointer-events: none;
}
.brand-name { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 15px; letter-spacing: .08em; }
.brand-sub { margin: 0; font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); letter-spacing: .06em; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 8px var(--nebula); }
.dot.soon { background: transparent; border: 1.4px solid var(--ink); box-shadow: none; width: 6px; height: 6px; }

.readout {
  position: fixed; z-index: 3; left: var(--edge-l); bottom: var(--edge-b);
  display: flex; gap: 14px; flex-wrap: wrap;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-dim);
  font-variant-numeric: tabular-nums; pointer-events: none;
}
.readout b { font-weight: 500; color: var(--ink); }

.zoom {
  position: fixed; z-index: 3; right: var(--edge-r); bottom: var(--edge-b);
  display: grid; gap: 8px;
}
.zoom button {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--line) 32%, transparent);
  background: color-mix(in srgb, var(--space) 55%, transparent);
  color: var(--ink); font: 400 20px/1 var(--font-body);
  display: grid; place-items: center; cursor: pointer;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: border-color .2s ease, background .2s ease;
}
.zoom button:hover { border-color: color-mix(in srgb, var(--line) 70%, transparent); background: color-mix(in srgb, var(--space-mid) 70%, transparent); }
.zoom button:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }

.hint {
  position: fixed; z-index: 3; left: 50%; bottom: calc(var(--edge-b) + 56px);
  transform: translateX(-50%); margin: 0; padding: 8px 14px;
  max-width: calc(100% - 32px); text-align: center;
  font-size: 13px; color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--line) 22%, transparent); border-radius: 999px;
  background: color-mix(in srgb, var(--space) 60%, transparent);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  pointer-events: none; transition: opacity .6s ease;
}
.hint.gone { opacity: 0; }
.hint .short { display: none; }
.scrim { position: fixed; left: 0; right: 0; z-index: 2; pointer-events: none; }
.scrim.top { top: 0; height: calc(env(safe-area-inset-top, 0px) + 120px); background: linear-gradient(180deg, color-mix(in srgb, var(--space) 78%, transparent), transparent); }
.scrim.bottom { bottom: 0; height: calc(env(safe-area-inset-bottom, 0px) + 90px); background: linear-gradient(0deg, color-mix(in srgb, var(--space) 70%, transparent), transparent); }
@media (max-width: 520px) {
  .legend { font-size: 11px; }
  .hint { font-size: 12px; bottom: calc(var(--edge-b) + 100px); white-space: nowrap; }
  .hint .long { display: none; }
  .hint .short { display: inline; }
  .readout { right: calc(var(--edge-r) + 56px); gap: 4px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  #map, .label, .hint { transition: none; }
}
</style>
</head>
<body>

<main class="stage" id="stage">
  <canvas id="sky" aria-hidden="true"></canvas>
  <canvas id="map" tabindex="0" role="img" aria-label="Mapa del mundo. Arrastrá para moverlo; con las flechas también se mueve y con más y menos se acerca o se aleja."></canvas>
  <div class="label out" id="label" aria-live="polite">
    <span class="label-name" id="labelName"></span>
    <span class="label-meta" id="labelMeta"></span>
  </div>
</main>

<header class="brand">
  <p class="brand-name">Mapa galáctico</p>
  <p class="brand-sub">Boceto 1</p>
  <div class="legend" aria-label="Referencias">
    <span><i class="dot" aria-hidden="true"></i>En la guía</span>
    <span><i class="dot soon" aria-hidden="true"></i>Próximamente</span>
  </div>
</header>

<div class="readout" aria-hidden="true">
  <span>LAT <b id="lat">0°00′ N</b></span>
  <span>LON <b id="lon">0°00′ E</b></span>
  <span>ZOOM <b id="zoomv">×1,0</b></span>
</div>

<div class="zoom">
  <button type="button" id="zoomIn" aria-label="Acercar">+</button>
  <button type="button" id="zoomOut" aria-label="Alejar">−</button>
</div>

<div class="scrim top" aria-hidden="true"></div>
<div class="scrim bottom" aria-hidden="true"></div>
<p class="hint" id="hint"><span class="long">Arrastrá para recorrer el mundo · tocá un continente para centrarlo</span><span class="short">Arrastrá el mapa · tocá un continente</span></p>

    { id: 'AF', name: 'África',            area: '30,4', a: [19, 4],    l: [13, 18],    grow: 1.08 },
    { id: 'AS', name: 'Asia',              area: '44,6', a: [92, 44],   l: [96, 50],   grow: 1.06 },
    { id: 'OC', name: 'Oceanía',           area: '8,5',  a: [138, -24], l: [134, -24], grow: 1.12 }
  ].map(c => {
    const [x0, x1] = bboxOf(PATHS[c.id]);
    return { ...c, path: new Path2D(PATHS[c.id]), ax: c.a[0], ay: my(c.a[1]), lx: c.l[0], ly: my(c.l[1]),
             x0, x1, k: 1, kv: 0, glow: 0, hov: 0 };
  });
  const byId = Object.fromEntries(CONTS.map(c => [c.id, c]));

  // Ciudades de la guía (data/ciudades.js) y las que vienen (tarjetas #100 a #102)
  const CITIES = [
    { name: 'Buenos Aires', lon: -58.38, lat: -34.60, c: 'SA', live: true },
    { name: 'Berlín', lon: 13.40, lat: 52.52, c: 'EU', live: true },
    { name: 'París', lon: 2.35, lat: 48.86, c: 'EU', live: false },
    { name: 'Madrid', lon: -3.70, lat: 40.42, c: 'EU', live: false },
    { name: 'Roma', lon: 12.50, lat: 41.90, c: 'EU', live: false }
  ].map(p => ({ ...p, x: p.lon, y: my(p.lat), cont: null }));
  CITIES.forEach(p => { p.cont = byId[p.c]; });

  const PARALLELS = [
    { lat: 66.56, name: 'Círculo polar ártico', a: 0.10, dash: [2, 7] },
    { lat: 23.44, name: 'Trópico de Cáncer', a: 0.12, dash: [2, 7] },
    { lat: 0, name: 'Ecuador', a: 0.2, dash: [3, 5] },
    { lat: -23.44, name: 'Trópico de Capricornio', a: 0.12, dash: [2, 7] }
  ];

  const css = getComputedStyle(document.documentElement);
  const rgb = name => css.getPropertyValue(name).trim().split(/[\s,]+/).join(',');
  const LAND = rgb('--land-rgb'), GLOW = rgb('--glow-rgb');
  const UNDER = css.getPropertyValue('--under').trim();
  const INK = css.getPropertyValue('--ink').trim();
  const SPACE = css.getPropertyValue('--space').trim();
  const FONT_BODY = css.getPropertyValue('--font-body').trim();
  const FONT_MONO = css.getPropertyValue('--font-mono').trim();

  const stage = document.getElementById('stage');
  const sky = document.getElementById('sky'), sctx = sky.getContext('2d');
  const map = document.getElementById('map'), ctx = map.getContext('2d');
  const label = document.getElementById('label');
  const labelName = document.getElementById('labelName'), labelMeta = document.getElementById('labelMeta');
  const hint = document.getElementById('hint');
  const out = { lat: document.getElementById('lat'), lon: document.getElementById('lon'), z: document.getElementById('zoomv') };

  // Punto de prueba "¿está adentro?" (corrido para que todo quede en coordenadas positivas)
  const hit = document.createElement('canvas'); hit.width = 460; hit.height = 220;
  const hctx = hit.getContext('2d'); hctx.setTransform(1, 0, 0, 1, 200, 130);
  const inside = (c, x, y) => hctx.isPointInPath(c.path, x, y, 'evenodd');

  let W = 0, H = 0, dpr = 1, k0 = 1, zoom = 1;
  let cx = -25, cy = 0;
  let vx = 0, vy = 0;
  let glide = null, zoomAnim = null;
  let focus = null, hover = null, dirty = true, started = false;
  let lowFx = false, drawAvg = 0;
  let stars = [];
  const S = () => k0 * zoom;
  const wrapD = d => ((d + 180) % 360 + 360) % 360 - 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function clampView() {
    cx = wrapD(cx);
    const half = H / 2 / S();
    if (BOTTOM - TOP <= 2 * half) { cy = (TOP + BOTTOM) / 2; vy = 0; }
    else {
      const ny = clamp(cy, TOP + half, BOTTOM - half);
      if (ny !== cy) vy = 0;
      cy = ny;
    }
  }

  function resize() {
    W = stage.clientWidth; H = stage.clientHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    for (const c of [sky, map]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    k0 = Math.max(H / (BOTTOM - TOP), W / WORLD);
    const n = Math.min(900, Math.round(W * H / 2200));
    if (stars.length !== n) {
      stars = Array.from({ length: n }, () => {
        const r = Math.random();
        return { x: Math.random(), y: Math.random(), r: 0.35 + r * r * r * 1.5, a: 0.25 + Math.random() * 0.6,
                 depth: Math.random() < 0.7 ? 0.05 : 0.14, tw: Math.random() < 0.3 ? 0.6 + Math.random() * 2.2 : 0,
                 ph: Math.random() * 6.283, blue: Math.random() < 0.35 };
      });
    }
    clampView(); dirty = true;
  }

  /* ---------- Qué continente se agranda ---------- */
  function contAt(x, y) {
    // primero el que ya está agrandado, con su tamaño agrandado (así no titila en los bordes)
    if (focus) {
      for (const n of [-1, 0, 1]) {
        const px = x - n * WORLD;
        const qx = focus.ax + (px - focus.ax) / focus.k, qy = focus.ay + (y - focus.ay) / focus.k;
        if (inside(focus, qx, qy)) return focus;
      }
    }
    for (const c of CONTS) {
      if (c === focus) continue;
      for (const n of [-1, 0, 1]) if (inside(c, x - n * WORLD, y)) return c;
    }
    return null;
  }

  function updateFocus() {
    if (!started) return;
    let cand = contAt(cx, cy);
    if (!cand) {
      const s = S(); let best = null, bd = Infinity, fd = Infinity;
      for (const c of CONTS) {
        const d = Math.hypot(wrapD(c.ax - cx) * s, (c.ay - cy) * s);
        if (c === focus) fd = d;
        if (d < bd) { bd = d; best = c; }
      }
      if (focus && fd < bd * 1.15) best = focus, bd = fd;
      cand = bd < 0.45 * Math.max(W, H) ? best : null;
    }
    if (cand !== focus) setFocus(cand);
  }

  let labelTimer = 0;
  function setFocus(c) {
    focus = c; dirty = true;
    label.classList.add('out');
    clearTimeout(labelTimer);
    labelTimer = setTimeout(() => {
      if (!focus) return;
      labelName.textContent = focus.name;
      labelMeta.textContent = focus.area + ' millones de km²';
      label._w = label.offsetWidth; label._h = label.offsetHeight;
      label.classList.remove('out');
      dirty = true;
    }, reduced ? 0 : 170);
  }

  /* ---------- Dibujo ---------- */
  function copies(c, s) {
    const half = W / 2 / s, m = 30;
    const v0 = cx - half - m, v1 = cx + half + m, list = [];
    for (let n = Math.ceil((v0 - c.x1) / WORLD); n <= Math.floor((v1 - c.x0) / WORLD); n++) list.push(n);
    return list;
  }
  const toScreenX = (x, s) => W / 2 + (x - cx) * s;
  const toScreenY = (y, s) => H / 2 + (y - cy) * s;

  function drawGrid(s) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(' + GLOW + ',0.06)';
    ctx.setLineDash([]);
    ctx.beginPath();
    const half = W / 2 / s;
    for (let lon = Math.ceil((cx - half) / 15) * 15; lon <= cx + half; lon += 15) {
      const x = Math.round(toScreenX(lon, s)) + 0.5;
      ctx.moveTo(x, Math.max(0, toScreenY(TOP, s))); ctx.lineTo(x, Math.min(H, toScreenY(BOTTOM, s)));
    }
    for (let lat = -60; lat <= 80; lat += 15) {
      const y = Math.round(toScreenY(my(lat), s)) + 0.5;
      if (y > 0 && y < H) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    }
    ctx.stroke();
    ctx.font = '500 10px ' + FONT_MONO;
    ctx.textBaseline = 'bottom';
    if ('letterSpacing' in ctx) ctx.letterSpacing = '1.5px';
    const lx = Math.max(16, W * 0.02);
    for (const p of PARALLELS) {
      const y = Math.round(toScreenY(my(p.lat), s)) + 0.5;
      if (y < 0 || y > H) continue;
      ctx.strokeStyle = 'rgba(' + GLOW + ',' + p.a + ')';
      ctx.setLineDash(p.dash); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      ctx.fillStyle = 'rgba(' + GLOW + ',' + (p.a * 2.6) + ')';
      ctx.fillText(p.name.toUpperCase() + '  ' + Math.abs(p.lat).toFixed(p.lat ? 1 : 0).replace('.', ',') + '°', lx, y - 5);
    }
    ctx.setLineDash([]);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }

  function contTransform(c, n, s) {
    ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * (W / 2 + (n * WORLD - cx) * s), dpr * (H / 2 - cy * s));
    ctx.translate(c.ax, c.ay); ctx.scale(c.k, c.k); ctx.translate(-c.ax, -c.ay);
  }

  function drawCont(c, s) {
    const g = c.glow, sk = s * c.k;
    for (const n of copies(c, s)) {
      contTransform(c, n, s);
      if (g > 0.01) {
        if (!lowFx) { ctx.shadowColor = 'rgba(' + GLOW + ',' + (0.8 * g) + ')'; ctx.shadowBlur = 30 * dpr * g; }
        ctx.fillStyle = UNDER; ctx.globalAlpha = Math.min(1, g * 1.4);
        ctx.fill(c.path, 'evenodd');
        ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
      }
      ctx.fillStyle = 'rgba(' + LAND + ',' + (0.13 + 0.06 * c.hov + 0.17 * g) + ')';
      ctx.fill(c.path, 'evenodd');
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      if (g > 0.01) {
        ctx.strokeStyle = 'rgba(' + GLOW + ',' + (0.32 * g) + ')';
        ctx.lineWidth = (lowFx ? 7 : 4.5) / sk; ctx.stroke(c.path);
      }
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.72 + 0.12 * c.hov + 0.28 * g) + ')';
      ctx.lineWidth = (0.9 + 0.8 * g) / sk; ctx.stroke(c.path);
    }
  }

  function placed(c, x, y) { return [c.ax + (x - c.ax) * c.k, c.ay + (y - c.ay) * c.k]; }

  function drawCities(s) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = '600 12px ' + FONT_BODY;
    ctx.textBaseline = 'middle';
    for (const p of CITIES) {
      const [px, py] = placed(p.cont, p.x, p.y);
      const y = toScreenY(py, s);
      const n0 = Math.round((cx - px) / WORLD);
      for (const n of [n0 - 1, n0, n0 + 1]) {
        const x = toScreenX(px + n * WORLD, s);
        if (x < -40 || x > W + 40 || y < -20 || y > H + 20) continue;
        const g = p.cont.glow;
        const halo = ctx.createRadialGradient(x, y, 0, x, y, 9 + 5 * g);
        halo.addColorStop(0, 'rgba(' + GLOW + ',' + (0.55 + 0.3 * g) + ')');
        halo.addColorStop(1, 'rgba(' + GLOW + ',0)');
        ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(x, y, 9 + 5 * g, 0, 6.283); ctx.fill();
        ctx.beginPath(); ctx.arc(x, y, 2.6 + 0.6 * g, 0, 6.283);
        if (p.live) { ctx.fillStyle = INK; ctx.fill(); }
        else { ctx.strokeStyle = INK; ctx.lineWidth = 1.3; ctx.stroke(); }
        if (g > 0.05) {
          ctx.globalAlpha = Math.min(1, g * 1.3);
          ctx.shadowColor = SPACE; ctx.shadowBlur = 6;
          ctx.fillStyle = INK; ctx.fillText(p.name, x + 8, y);
          ctx.shadowBlur = 0; ctx.globalAlpha = 1;
        }
      }
    }
  }

  function placeLabel(s) {
    if (!focus || label._w == null) return;
    const [lx, ly] = placed(focus, focus.lx, focus.ly);
    const n = Math.round((cx - lx) / WORLD);
    let x = toScreenX(lx + n * WORLD, s), y = toScreenY(ly, s);
    const pw = label._w / 2 + 16, ph = label._h / 2 + 70;
    x = clamp(x, pw, W - pw); y = clamp(y, ph, H - ph);
    label.style.transform = 'translate3d(' + (x - label._w / 2).toFixed(1) + 'px,' + (y - label._h / 2).toFixed(1) + 'px,0)';
  }

  function fmt(v, pos, neg) {
    const a = Math.abs(v), d = Math.floor(a), m = Math.floor((a - d) * 60);
    return d + '°' + String(m).padStart(2, '0') + '′ ' + (v >= 0 ? pos : neg);
  }

  function drawMap() {
    const t0 = performance.now(), s = S();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, map.width, map.height);
    drawGrid(s);
    const order = CONTS.slice().sort((a, b) => (a.glow + a.hov * 0.01) - (b.glow + b.hov * 0.01));
    for (const c of order) drawCont(c, s);
    drawCities(s);
    placeLabel(s);
    out.lat.textContent = fmt(latOf(cy), 'N', 'S');
    out.lon.textContent = fmt(wrapD(cx), 'E', 'O');
    out.z.textContent = '×' + zoom.toFixed(1).replace('.', ',');
    const t = performance.now() - t0;
    drawAvg = drawAvg ? drawAvg * 0.9 + t * 0.1 : t;
    if (!lowFx && drawAvg > 14) lowFx = true;
  }

  let skyLast = 0;
  function drawSky(now, force) {
    if (!force && (reduced || now - skyLast < 33)) return;
    skyLast = now;
    const s = S();
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.clearRect(0, 0, W, H);
    const ox = cx * s, oy = cy * s, t = now / 1000;
    for (const st of stars) {
      const x = (((st.x * W - ox * st.depth) % W) + W) % W;
      const y = (((st.y * H - oy * st.depth) % H) + H) % H;
      let a = st.a;
      if (st.tw && !reduced) a *= 0.55 + 0.45 * Math.sin(t * st.tw + st.ph);
      sctx.fillStyle = st.blue ? 'rgba(' + GLOW + ',' + a + ')' : 'rgba(238,243,255,' + a + ')';
      if (st.r < 0.9) sctx.fillRect(x, y, st.r * 1.6, st.r * 1.6);
      else { sctx.beginPath(); sctx.arc(x, y, st.r, 0, 6.283); sctx.fill(); }
    }
  }

  /* ---------- Movimiento ---------- */
  function panBy(dx, dy) { const s = S(); cx -= dx / s; cy -= dy / s; clampView(); dirty = true; }

  function zoomAt(z, sx, sy) {
    z = clamp(z, 1, 6);
    const s0 = S(), mx = cx + (sx - W / 2) / s0, mY = cy + (sy - H / 2) / s0;
    zoom = z;
    const s1 = S(); cx = mx - (sx - W / 2) / s1; cy = mY - (sy - H / 2) / s1;
    clampView(); dirty = true;
  }

  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function glideTo(x, y, dur = 850) {
    vx = vy = 0;
    glide = { x0: cx, y0: cy, dx: wrapD(x - cx), dy: y - cy, t0: performance.now(), dur: reduced ? 1 : dur };
  }
  function animateZoom(factor, sx = W / 2, sy = H / 2) {
    zoomAnim = { z0: zoom, z1: clamp(zoom * factor, 1, 6), sx, sy, t0: performance.now(), dur: reduced ? 1 : 280 };
  }

  let hintShown = true;
  function hideHint() { if (hintShown) { hintShown = false; hint.classList.add('gone'); } }

  const pointers = new Map();
  let drag = null, pinch = null;

  map.addEventListener('pointerdown', e => {
    map.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    glide = null; zoomAnim = null;
    if (pointers.size === 1) {
      drag = { x0: e.clientX, y0: e.clientY, last: e.timeStamp, moved: false, multi: false };
      vx = vy = 0;
      map.classList.add('dragging');
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: zoom, mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } };
      if (drag) { drag.moved = true; drag.multi = true; }
    }
  });

  map.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId);
    if (!p) {
      if (e.pointerType === 'mouse') {
        const s = S(), c = contAt(cx + (e.clientX - W / 2) / s, cy + (e.clientY - H / 2) / s);
        if (c !== hover) { hover = c; dirty = true; }
      }
      return;
    }
    const px = p.x, py = p.y; p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1 && drag) {
      const dx = p.x - px, dy = p.y - py;
      panBy(dx, dy);
      const dt = (e.timeStamp - drag.last) / 1000;
      if (dt > 0) { vx = vx * 0.7 + (dx / dt) * 0.3; vy = vy * 0.7 + (dy / dt) * 0.3; }
      drag.last = e.timeStamp;
      if (!drag.moved && Math.hypot(p.x - drag.x0, p.y - drag.y0) > 6) { drag.moved = true; hideHint(); }
    } else if (pointers.size >= 2 && pinch) {
      const [a, b] = [...pointers.values()];
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      panBy(mid.x - pinch.mid.x, mid.y - pinch.mid.y);
      zoomAt(pinch.z0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0, mid.x, mid.y);
      pinch.mid = mid; hideHint();
    }
  });

  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 1) {
      // se levantó un dedo del pellizco: se sigue arrastrando con el otro, sin envión
      pinch = null; vx = vy = 0;
      if (drag) drag.last = e.timeStamp;
      return;
    }
    if (pointers.size > 0) return;
    map.classList.remove('dragging');
    if (drag && !drag.moved && e.type === 'pointerup') {
      const s = S(), c = contAt(cx + (e.clientX - W / 2) / s, cy + (e.clientY - H / 2) / s);
      if (c) { glideTo(c.ax, c.ay); hideHint(); }
    } else if (drag && (drag.multi || e.timeStamp - drag.last > 90 || reduced)) { vx = vy = 0; }
    const v = Math.hypot(vx, vy); if (v > 4000) { vx *= 4000 / v; vy *= 4000 / v; }
    drag = null; pinch = null;
  }
  map.addEventListener('pointerup', endPointer);
  map.addEventListener('pointercancel', endPointer);
  map.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && hover) { hover = null; dirty = true; } });

  map.addEventListener('wheel', e => {
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : 1;
    zoomAt(zoom * Math.exp(-e.deltaY * unit * (e.ctrlKey ? 0.01 : 0.0016)), e.clientX, e.clientY);
    glide = null; zoomAnim = null; hideHint();
  }, { passive: false });

  map.addEventListener('keydown', e => {
    const s = S(), step = 140 / s;
    const keys = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    if (keys[e.key]) { e.preventDefault(); glideTo(cx + keys[e.key][0], cy + keys[e.key][1], 320); hideHint(); }
    else if (e.key === '+' || e.key === '=') { e.preventDefault(); animateZoom(1.6); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); animateZoom(1 / 1.6); }
  });
  document.getElementById('zoomIn').addEventListener('click', () => { animateZoom(1.6); hideHint(); });
  document.getElementById('zoomOut').addEventListener('click', () => { animateZoom(1 / 1.6); hideHint(); });

  window.addEventListener('resize', resize);

  /* ---------- Bucle ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    let viewMoved = false;

    if (glide) {
      const t = Math.min(1, (now - glide.t0) / glide.dur), e = ease(t);
      cx = glide.x0 + glide.dx * e; cy = glide.y0 + glide.dy * e; clampView();
      dirty = viewMoved = true; if (t >= 1) glide = null;
    } else if (!drag && (Math.abs(vx) > 3 || Math.abs(vy) > 3)) {
      panBy(vx * dt, vy * dt);
      const f = Math.exp(-dt * 3.6); vx *= f; vy *= f;
      viewMoved = true;
    }
    if (zoomAnim) {
      const t = Math.min(1, (now - zoomAnim.t0) / zoomAnim.dur);
      zoomAt(zoomAnim.z0 + (zoomAnim.z1 - zoomAnim.z0) * ease(t), zoomAnim.sx, zoomAnim.sy);
      viewMoved = true; if (t >= 1) zoomAnim = null;
    }
    if (dirty || viewMoved) updateFocus();

    // resorte: el continente del centro crece un poco (menos cuanto más cerca estás)
    for (const c of CONTS) {
      const target = c === focus ? 1 + (c.grow - 1) / Math.sqrt(zoom) : 1;
      if (reduced) { c.k = target; c.kv = 0; }
      else {
        const a = 170 * (target - c.k) - 17 * c.kv;
        c.kv += a * dt; c.k += c.kv * dt;
      }
      const gt = c === focus ? 1 : 0, ht = c === hover ? 1 : 0;
      const gl = reduced ? gt : c.glow + (gt - c.glow) * Math.min(1, dt * 7);
      const hv = reduced ? ht : c.hov + (ht - c.hov) * Math.min(1, dt * 10);
      if (Math.abs(gl - c.glow) > 0.0005 || Math.abs(hv - c.hov) > 0.0005 || Math.abs(c.kv) > 0.0005 || Math.abs(target - c.k) > 0.0005) dirty = true;
      c.glow = gl; c.hov = hv;
    }

    if (dirty) { drawMap(); drawSky(now, true); dirty = false; }
    else drawSky(now, false);
    requestAnimationFrame(frame);
  }

  resize();
  if (W < 700) { cx = -60; cy = my(-16); clampView(); }
  requestAnimationFrame(t => { last = t; map.classList.add('ready'); frame(t); });
  setTimeout(() => { started = true; dirty = true; }, reduced ? 0 : 450);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dirty = true; if (focus) setFocus(focus); });
})();
</script>
</body>
</html>
