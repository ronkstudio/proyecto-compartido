<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Galáctico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;600;700&family=Unbounded:wght@300;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* Diseño: globo visto en diagonal desde arriba, con el horizonte curvo arriba y el cielo con estrellas detrás. Nombre arriba a la izquierda, ajustes arriba a la derecha, coordenadas abajo a la izquierda, zoom abajo a la derecha. */
:root {
  --space: #030a24;          /* fondo: azul casi negro */
  --space-mid: #0b2066;      /* azul galáctico */
  --nebula: #2b5cff;         /* brillo azul de la nebulosa */
  --violet: #5a2fd8;         /* toque violeta */
  --ink: #eef3ff;            /* texto */
  --ink-dim: #93a6dd;        /* texto secundario */
  --line: #ffffff;           /* fronteras de los continentes */
  --land-rgb: 74 132 255;    /* relleno de los continentes */
  --glow-rgb: 120 172 255;   /* halo del continente elegido */
  --under: #061650;          /* base del continente agrandado */
  --ocean: #071a58;          /* mar del globo */
  --city: #ff2e4d;           /* ciudades que ya están en la guía */
  --city-rgb: 255 46 77;
  --font-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --edge-l: max(16px, env(safe-area-inset-left, 0px));
  --edge-r: max(16px, env(safe-area-inset-right, 0px));
  --edge-t: calc(env(safe-area-inset-top, 0px) + 16px);
  --edge-b: calc(env(safe-area-inset-bottom, 0px) + 16px);
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
[hidden] { display: none !important; }
body {
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  color: var(--ink);
  font-family: var(--font-body);
  background:
    radial-gradient(70vmax 50vmax at 16% 10%, color-mix(in srgb, var(--nebula) 30%, transparent), transparent 62%),
    radial-gradient(60vmax 45vmax at 88% 88%, color-mix(in srgb, var(--violet) 26%, transparent), transparent 60%),
    radial-gradient(55vmax 40vmax at 55% 45%, color-mix(in srgb, var(--space-mid) 70%, transparent), transparent 72%),
    var(--space);
  -webkit-font-smoothing: antialiased;
}
.stage { position: fixed; inset: 0; }
.stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, color-mix(in srgb, var(--space) 70%, transparent) 100%);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#map { cursor: grab; touch-action: none; opacity: 0; transition: opacity 1.1s ease; outline: none; }
#map.ready { opacity: 1; }
#map.dragging { cursor: grabbing; }
#map:focus-visible { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--line) 55%, transparent); }

.label {
  position: absolute; left: 0; top: 0; z-index: 2;
  display: grid; justify-items: center; gap: 6px;
  pointer-events: none; text-align: center; white-space: nowrap;
  will-change: transform; transition: opacity .28s ease;
}
.label.out { opacity: 0; }
.label-name {
  font-family: var(--font-display); font-weight: 300;
  font-size: clamp(20px, 3.4vw, 40px); letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink);
  text-shadow: 0 0 22px color-mix(in srgb, var(--nebula) 90%, transparent), 0 0 2px var(--space);
}
.label-meta {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-dim); text-shadow: 0 0 6px var(--space);
}

.brand {
  position: fixed; z-index: 3; top: var(--edge-t); left: var(--edge-l);
  display: grid; gap: 6px; pointer-events: none;
}
.brand-name { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 15px; letter-spacing: .08em; }
.brand-sub { margin: 0; font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); letter-spacing: .06em; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--city); box-shadow: 0 0 8px var(--city), 0 0 2px var(--city); }
.dot.soon { background: transparent; border: 1.4px solid var(--ink); box-shadow: none; width: 6px; height: 6px; }

.readout {
  position: fixed; z-index: 3; left: var(--edge-l); bottom: var(--edge-b);
  display: flex; gap: 14px; flex-wrap: wrap;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-dim);
  font-variant-numeric: tabular-nums; pointer-events: none;
}
.readout b { font-weight: 500; color: var(--ink); }

.zoom {
  position: fixed; z-index: 3; right: var(--edge-r); bottom: var(--edge-b);
  display: grid; gap: 8px;
}
.zoom button {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--line) 32%, transparent);
  background: color-mix(in srgb, var(--space) 55%, transparent);
  color: var(--ink); font: 400 20px/1 var(--font-body);
  display: grid; place-items: center; cursor: pointer;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: border-color .2s ease, background .2s ease;
}
.zoom button:hover { border-color: color-mix(in srgb, var(--line) 70%, transparent); background: color-mix(in srgb, var(--space-mid) 70%, transparent); }
.zoom button:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }

.hint {
  position: fixed; z-index: 3; left: 50%; bottom: calc(var(--edge-b) + 56px);
  transform: translateX(-50%); margin: 0; padding: 8px 14px;
  max-width: calc(100% - 32px); text-align: center;
  font-size: 13px; color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--line) 22%, transparent); border-radius: 999px;
  background: color-mix(in srgb, var(--space) 60%, transparent);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  pointer-events: none; transition: opacity .6s ease;
}
.hint.gone { opacity: 0; }
.hint .short { display: none; }
.tune-btn {
  position: fixed; z-index: 4; top: var(--edge-t); right: var(--edge-r);
  padding: 8px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--line) 32%, transparent);
  background: color-mix(in srgb, var(--space) 55%, transparent);
  color: var(--ink); font: 600 13px/1 var(--font-body);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.tune-btn:hover { border-color: color-mix(in srgb, var(--line) 70%, transparent); }
.tune-btn:focus-visible, .tune input:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
.tune {
  position: fixed; z-index: 4; top: calc(var(--edge-t) + 44px); right: var(--edge-r);
  width: min(260px, calc(100vw - 32px)); padding: 16px; margin: 0;
  display: grid; gap: 10px;
  border: 1px solid color-mix(in srgb, var(--line) 22%, transparent); border-radius: 14px;
  background: color-mix(in srgb, var(--space) 82%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-size: 13px;
}
.tune label { display: flex; justify-content: space-between; gap: 12px; color: var(--ink); }
.tune output { font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.tune input[type=range] { width: 100%; margin: 0 0 6px; accent-color: var(--nebula); }
.tune .check { justify-content: flex-start; align-items: center; gap: 8px; cursor: pointer; }
.tune .check input { accent-color: var(--nebula); width: 16px; height: 16px; margin: 0; }
.tune .note { margin: 2px 0 0; font-size: 12px; color: var(--ink-dim); line-height: 1.45; }
.scrim { position: fixed; left: 0; right: 0; z-index: 2; pointer-events: none; }
.scrim.top { top: 0; height: calc(env(safe-area-inset-top, 0px) + 120px); background: linear-gradient(180deg, color-mix(in srgb, var(--space) 78%, transparent), transparent); }
.scrim.bottom { bottom: 0; height: calc(env(safe-area-inset-bottom, 0px) + 90px); background: linear-gradient(0deg, color-mix(in srgb, var(--space) 70%, transparent), transparent); }
@media (max-width: 520px) {
  .legend { font-size: 11px; }
  .hint { font-size: 12px; bottom: calc(var(--edge-b) + 100px); white-space: nowrap; }
  .hint .long { display: none; }
  .hint .short { display: inline; }
  .readout { right: calc(var(--edge-r) + 56px); gap: 4px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  #map, .label, .hint { transition: none; }
}
</style>
</head>
<body>

<main class="stage" id="stage">
  <canvas id="sky" aria-hidden="true"></canvas>
  <canvas id="map" tabindex="0" role="img" aria-label="Globo terráqueo. Arrastrá para girarlo; con las flechas también gira y con más y menos se acerca o se aleja."></canvas>
  <div class="label out" id="label" aria-live="polite">
    <span class="label-name" id="labelName"></span>
    <span class="label-meta" id="labelMeta"></span>
  </div>
</main>

<header class="brand">
  <p class="brand-name">Mapa galáctico</p>
  <p class="brand-sub">Boceto 2 · globo</p>
  <div class="legend" aria-label="Referencias">
    <span><i class="dot" aria-hidden="true"></i>En la guía</span>
    <span><i class="dot soon" aria-hidden="true"></i>Próximamente</span>
  </div>
</header>

<div class="readout" aria-hidden="true">
  <span>LAT <b id="lat">0°00′ N</b></span>
  <span>LON <b id="lon">0°00′ E</b></span>
  <span>ZOOM <b id="zoomv">×1,0</b></span>
</div>

<button type="button" class="tune-btn" id="tuneBtn" aria-expanded="false" aria-controls="tune">Ajustar</button>
<form class="tune" id="tune" hidden>
  <label for="tilt">Inclinación <output id="tiltOut" for="tilt">30°</output></label>
  <input type="range" id="tilt" min="0" max="50" step="1" value="30">
  <label for="grow">Cuánto se agranda <output id="growOut" for="grow">10 %</output></label>
  <input type="range" id="grow" min="0" max="30" step="1" value="10">
  <label class="check" for="spin"><input type="checkbox" id="spin" checked> Girar solo</label>
  <p class="note">Probá valores y pasame los que te gusten.</p>
</form>

<div class="zoom">
  <button type="button" id="zoomIn" aria-label="Acercar">+</button>
  <button type="button" id="zoomOut" aria-label="Alejar">−</button>
</div>

<div class="scrim top" aria-hidden="true"></div>
<div class="scrim bottom" aria-hidden="true"></div>
<p class="hint" id="hint"><span class="long">Arrastrá para girar el globo · tocá un continente para centrarlo</span><span class="short">Arrastrá para girar el globo</span></p>

    ctx.beginPath(); path(SPHERE);
    if (!lowFx) { ctx.shadowColor = 'rgba(' + GLOW + ',0.9)'; ctx.shadowBlur = 55; }
    ctx.strokeStyle = 'rgba(' + GLOW + ',0.5)'; ctx.lineWidth = 10; ctx.stroke();
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
    // mar
    ctx.fillStyle = OCEAN; ctx.fill();
    const haze = ctx.createLinearGradient(0, sphereTop, 0, sphereTop + H * 0.35);
    haze.addColorStop(0, 'rgba(' + GLOW + ',0.38)');
    haze.addColorStop(1, 'rgba(' + GLOW + ',0)');
    ctx.fillStyle = haze; ctx.fill();
    const deep = ctx.createLinearGradient(0, H * 0.5, 0, H);
    deep.addColorStop(0, 'rgba(2,6,23,0)'); deep.addColorStop(1, 'rgba(2,6,23,0.35)');
    ctx.fillStyle = deep; ctx.fill();
    // cuadrícula, ecuador y trópicos
    ctx.beginPath(); path(GRATICULE);
    ctx.strokeStyle = 'rgba(' + GLOW + ',0.08)'; ctx.lineWidth = 1; ctx.stroke();
    for (const p of PARALLELS) {
      ctx.beginPath(); path(p.g); ctx.setLineDash(p.dash);
      ctx.strokeStyle = 'rgba(' + GLOW + ',' + p.a + ')'; ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  function drawCont(c) {
    const g = c.glow;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (g > 0.01) {
      // sombra sobre el globo
      ctx.beginPath(); path(c.feature);
      if (!lowFx) { ctx.shadowColor = 'rgba(1,4,18,0.9)'; ctx.shadowBlur = 18; }
      ctx.fillStyle = 'rgba(1,4,18,' + (0.55 * g) + ')'; ctx.fill('evenodd');
      ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
      // el continente levantado y agrandado
      const ap = anchorScreen(c);
      ctx.save();
      ctx.translate(ap[0], ap[1] - lift(c)); ctx.scale(c.k, c.k); ctx.translate(-ap[0], -ap[1]);
      ctx.beginPath(); path(c.feature);
      if (!lowFx) { ctx.shadowColor = 'rgba(' + GLOW + ',' + (0.85 * g) + ')'; ctx.shadowBlur = 34 * g; }
      ctx.globalAlpha = Math.min(1, g * 1.4); ctx.fillStyle = UNDER; ctx.fill('evenodd');
      ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
      ctx.fillStyle = 'rgba(' + LAND + ',' + (0.2 + 0.18 * g) + ')'; ctx.fill('evenodd');
      ctx.strokeStyle = 'rgba(' + GLOW + ',' + (0.32 * g) + ')'; ctx.lineWidth = (lowFx ? 7 : 4.5) / c.k; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.75 + 0.25 * g) + ')'; ctx.lineWidth = (0.9 + 0.8 * g) / c.k; ctx.stroke();
      ctx.restore();
      return;
    }
    ctx.beginPath(); path(c.feature);
    ctx.fillStyle = 'rgba(' + LAND + ',' + (0.17 + 0.08 * c.hov) + ')'; ctx.fill('evenodd');
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.72 + 0.15 * c.hov) + ')'; ctx.lineWidth = 0.9; ctx.stroke();
  }

  function drawCities() {
    ctx.font = '700 12px ' + FONT_BODY; ctx.textBaseline = 'middle';
    for (const p of CITIES) {
      if (!visible(p.p)) continue;
      const [x, y] = lifted(p.cont, proj(p.p));
      if (x < -40 || x > W + 40 || y < -20 || y > H + 20) continue;
      const g = p.cont.glow;
      if (p.live) {
        const R = 11 + 5 * g;
        const halo = ctx.createRadialGradient(x, y, 0, x, y, R);
        halo.addColorStop(0, 'rgba(' + CITY + ',0.85)'); halo.addColorStop(0.35, 'rgba(' + CITY + ',0.35)'); halo.addColorStop(1, 'rgba(' + CITY + ',0)');
        ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(x, y, R, 0, 6.283); ctx.fill();
        ctx.fillStyle = 'rgb(' + CITY + ')'; ctx.beginPath(); ctx.arc(x, y, 3.4 + 0.6 * g, 0, 6.283); ctx.fill();
        ctx.fillStyle = 'rgba(255,235,238,0.95)'; ctx.beginPath(); ctx.arc(x, y, 1.2, 0, 6.283); ctx.fill();
      } else {
        ctx.strokeStyle = INK; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(x, y, 2.8 + 0.5 * g, 0, 6.283); ctx.stroke();
      }
      if (g > 0.05) {
        ctx.globalAlpha = Math.min(1, g * 1.3); ctx.shadowColor = SPACE; ctx.shadowBlur = 6;
        ctx.fillStyle = INK; ctx.fillText(p.name, x + 9, y);
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      }
    }
  }

  function placeLabel() {
    if (!focus || label._w == null) return;
    let p = visible(focus.l) ? lifted(focus, proj(focus.l)) : F().slice();
    const pw = label._w / 2 + 16, top = sphereTop + label._h / 2 + 30, bottom = H - label._h / 2 - 80;
    const x = clamp(p[0], pw, W - pw), y = clamp(p[1], Math.min(top, bottom), bottom);
    label.style.transform = 'translate3d(' + (x - label._w / 2).toFixed(1) + 'px,' + (y - label._h / 2).toFixed(1) + 'px,0)';
  }

  function fmt(v, pos, neg) {
    const a = Math.abs(v), d = Math.floor(a), m = Math.floor((a - d) * 60);
    return d + '°' + String(m).padStart(2, '0') + '′ ' + (v >= 0 ? pos : neg);
  }

  function draw() {
    const t0 = performance.now();
    applyView();
    sphereTop = d3.geoPath(proj).bounds(SPHERE)[0][1];
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawGlobe();
    const order = CONTS.slice().sort((a, b) => (a.glow + a.hov * 0.01) - (b.glow + b.hov * 0.01));
    for (const c of order) drawCont(c);
    ctx.beginPath(); path(SPHERE);
    ctx.strokeStyle = 'rgba(200,222,255,0.6)'; ctx.lineWidth = 1.2; ctx.stroke();
    drawCities();
    placeLabel();
    const g = geoAt(...F());
    if (g) { out.lat.textContent = fmt(g[1], 'N', 'S'); out.lon.textContent = fmt(wrap(g[0]), 'E', 'O'); }
    out.z.textContent = '×' + zoom.toFixed(1).replace('.', ',');
    const t = performance.now() - t0;
    drawAvg = drawAvg ? drawAvg * 0.9 + t * 0.1 : t;
    if (!lowFx && drawAvg > 18) lowFx = true;
  }

  let skyLast = 0;
  function drawSky(now, force) {
    if (!force && (reduced || now - skyLast < 33)) return;
    skyLast = now;
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.clearRect(0, 0, W, H);
    const t = now / 1000;
    for (const st of stars) {
      const x = (((st.x * W + lon * st.depth) % W) + W) % W;
      const y = (((st.y * H - lat * st.depth) % H) + H) % H;
      let a = st.a;
      if (st.tw && !reduced) a *= 0.55 + 0.45 * Math.sin(t * st.tw + st.ph);
      sctx.fillStyle = st.blue ? 'rgba(' + GLOW + ',' + a + ')' : 'rgba(238,243,255,' + a + ')';
      if (st.r < 0.9) sctx.fillRect(x, y, st.r * 1.6, st.r * 1.6);
      else { sctx.beginPath(); sctx.arc(x, y, st.r, 0, 6.283); sctx.fill(); }
    }
  }

  /* ---------- Movimiento ---------- */
  const degPerPx = () => DEG / (base * zoom);
  function rotateBy(dx, dy) {
    const r = degPerPx();
    lon = wrap(lon - dx * r); lat = clamp(lat + dy * r, -72, 62);
    dirty = true;
  }
  const setZoom = z => { zoom = clamp(z, 0.6, 3.2); dirty = true; };

  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function glideTo(tLon, tLat, dur = 950) {
    vLon = vLat = 0;
    glide = { lon0: lon, lat0: lat, dlon: wrap(tLon - lon), dlat: clamp(tLat, -72, 62) - lat, t0: performance.now(), dur: reduced ? 1 : dur };
  }
  const centerOn = c => glideTo(c.a[0], c.a[1] - centerOffset());
  function animateZoom(f) { zoomAnim = { z0: zoom, z1: clamp(zoom * f, 0.6, 3.2), t0: performance.now(), dur: reduced ? 1 : 300 }; }

  let hintShown = true;
  const touched = () => { lastTouch = performance.now(); if (hintShown) { hintShown = false; hint.classList.add('gone'); } };

  const pointers = new Map();
  let drag = null, pinch = null;
  map.addEventListener('pointerdown', e => {
    map.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    glide = null; zoomAnim = null; lastTouch = performance.now();
    if (pointers.size === 1) {
      drag = { x0: e.clientX, y0: e.clientY, last: e.timeStamp, moved: false, multi: false };
      vLon = vLat = 0; map.classList.add('dragging');
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: zoom, mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } };
      if (drag) { drag.moved = true; drag.multi = true; }
    }
  });
  map.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId);
    if (!p) {
      if (e.pointerType === 'mouse') { const c = contAt(e.clientX, e.clientY); if (c !== hover) { hover = c; dirty = true; } }
      return;
    }
    const px = p.x, py = p.y; p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1 && drag) {
      const dx = p.x - px, dy = p.y - py, r = degPerPx();
      rotateBy(dx, dy);
      const dt = (e.timeStamp - drag.last) / 1000;
      if (dt > 0) { vLon = vLon * 0.7 + (-dx * r / dt) * 0.3; vLat = vLat * 0.7 + (dy * r / dt) * 0.3; }
      drag.last = e.timeStamp;
      if (!drag.moved && Math.hypot(p.x - drag.x0, p.y - drag.y0) > 6) { drag.moved = true; touched(); }
      lastTouch = performance.now();
    } else if (pointers.size >= 2 && pinch) {
      const [a, b] = [...pointers.values()];
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      rotateBy(mid.x - pinch.mid.x, mid.y - pinch.mid.y);
      setZoom(pinch.z0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0);
      pinch.mid = mid; touched();
    }
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 1) { pinch = null; vLon = vLat = 0; if (drag) drag.last = e.timeStamp; return; }
    if (pointers.size > 0) return;
    map.classList.remove('dragging');
    if (drag && !drag.moved && e.type === 'pointerup') {
      const c = contAt(e.clientX, e.clientY);
      if (c) { centerOn(c); touched(); }
    } else if (drag && (drag.multi || e.timeStamp - drag.last > 90 || reduced)) { vLon = vLat = 0; }
    vLon = clamp(vLon, -400, 400); vLat = clamp(vLat, -300, 300);
    drag = null; pinch = null; lastTouch = performance.now();
  }
  map.addEventListener('pointerup', endPointer);
  map.addEventListener('pointercancel', endPointer);
  map.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && hover) { hover = null; dirty = true; } });
  map.addEventListener('wheel', e => {
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : 1;
    setZoom(zoom * Math.exp(-e.deltaY * unit * (e.ctrlKey ? 0.01 : 0.0016)));
    zoomAnim = null; touched();
  }, { passive: false });
  map.addEventListener('keydown', e => {
    const keys = { ArrowLeft: [-12, 0], ArrowRight: [12, 0], ArrowUp: [0, 8], ArrowDown: [0, -8] };
    if (keys[e.key]) { e.preventDefault(); glideTo(lon + keys[e.key][0], lat + keys[e.key][1], 380); touched(); }
    else if (e.key === '+' || e.key === '=') { e.preventDefault(); animateZoom(1.4); touched(); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); animateZoom(1 / 1.4); touched(); }
  });
  document.getElementById('zoomIn').addEventListener('click', () => { animateZoom(1.4); touched(); });
  document.getElementById('zoomOut').addEventListener('click', () => { animateZoom(1 / 1.4); touched(); });
  window.addEventListener('resize', layout);

  /* ---------- Ajustes ---------- */
  const tuneBtn = document.getElementById('tuneBtn'), tune = document.getElementById('tune');
  const tilt = document.getElementById('tilt'), grow = document.getElementById('grow'), spin = document.getElementById('spin');
  const tiltOut = document.getElementById('tiltOut'), growOut = document.getElementById('growOut');
  function showSettings() {
    tilt.value = settings.tilt; grow.value = settings.grow; spin.checked = settings.spin;
    tiltOut.textContent = settings.tilt + '°'; growOut.textContent = settings.grow + ' %';
  }
  tuneBtn.addEventListener('click', () => {
    tune.hidden = !tune.hidden; tuneBtn.setAttribute('aria-expanded', String(!tune.hidden));
  });
  tune.addEventListener('submit', e => e.preventDefault());
  tilt.addEventListener('input', () => {
    settings.tilt = +tilt.value; showSettings(); saveSettings();
    const keep = { lon, lat }; proj = mutate(P, settings.tilt * RAD).clipAngle(CLIP).precision(0.8);
    path = d3.geoPath(proj, ctx); lon = keep.lon; lat = keep.lat; layout();
  });
  grow.addEventListener('input', () => { settings.grow = +grow.value; showSettings(); saveSettings(); dirty = true; });
  spin.addEventListener('change', () => { settings.spin = spin.checked; saveSettings(); });
  showSettings();

  /* ---------- Bucle ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    let moved = false;
    if (glide) {
      const t = Math.min(1, (now - glide.t0) / glide.dur), e = ease(t);
      lon = wrap(glide.lon0 + glide.dlon * e); lat = glide.lat0 + glide.dlat * e;
      moved = true; if (t >= 1) { glide = null; lastTouch = now; }
    } else if (!drag && (Math.abs(vLon) > 0.5 || Math.abs(vLat) > 0.5)) {
      lon = wrap(lon + vLon * dt); lat = clamp(lat + vLat * dt, -72, 62);
      const f = Math.exp(-dt * 3.4); vLon *= f; vLat *= f; moved = true;
    } else if (settings.spin && !drag && !reduced && now - lastTouch > 3000) {
      // gira solo, despacio, de oeste a este
      lon = wrap(lon - 4 * dt); moved = true;
    }
    if (zoomAnim) {
      const t = Math.min(1, (now - zoomAnim.t0) / zoomAnim.dur);
      setZoom(zoomAnim.z0 + (zoomAnim.z1 - zoomAnim.z0) * ease(t)); moved = true;
      if (t >= 1) zoomAnim = null;
    }
    if (moved) dirty = true;
    if (dirty) { applyView(); updateFocus(); }

    // resorte: el continente del centro crece (los chicos un poco más que los grandes)
    for (const c of CONTS) {
      const target = c === focus ? 1 + settings.grow / 100 * c.grow / Math.sqrt(zoom) : 1;
      if (reduced) { c.k = target; c.kv = 0; }
      else { const a = 170 * (target - c.k) - 17 * c.kv; c.kv += a * dt; c.k += c.kv * dt; }
      const gt = c === focus ? 1 : 0, ht = c === hover ? 1 : 0;
      const gl = reduced ? gt : c.glow + (gt - c.glow) * Math.min(1, dt * 7);
      const hv = reduced ? ht : c.hov + (ht - c.hov) * Math.min(1, dt * 10);
      if (Math.abs(gl - c.glow) > 0.0005 || Math.abs(hv - c.hov) > 0.0005 || Math.abs(c.kv) > 0.0005 || Math.abs(target - c.k) > 0.0005) dirty = true;
      c.glow = gl; c.hov = hv;
    }
    if (dirty) { draw(); drawSky(now, true); dirty = false; } else drawSky(now, false);
    requestAnimationFrame(frame);
  }

  layout();
  // arranca mirando América del Sur, donde empieza la guía
  lon = -60; lat = -16 - centerOffset(); applyView();
  lastTouch = performance.now() - 1500;
  requestAnimationFrame(t => { last = t; map.classList.add('ready'); frame(t); });
  setTimeout(() => { started = true; dirty = true; }, reduced ? 0 : 450);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dirty = true; if (focus) setFocus(focus); });
})();
</script>
</body>
</html>
