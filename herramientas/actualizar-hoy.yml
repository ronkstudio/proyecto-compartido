# Paso automático que actualiza la agenda de "Hoy" de cada ciudad todos los días (tarjetas #65 y #99).
#
# ACTIVADO el 12/11 (lo pidió Bautista) en el repositorio
# PÚBLICO donde está publicada la guía (ronkstudio/menu-3d-publico), copiando:
#   - este archivo a  .github/workflows/actualizar-hoy.yml
#   - herramientas/armar-hoy.ps1 y herramientas/armar-hoy-berlin.ps1  a  herramientas/
# No necesita claves: usa el permiso que GitHub le da a cada repositorio para escribir en sí mismo.
#
# Qué hace: dos veces por día baja la agenda oficial de cada ciudad y, si cambió, sube
#   guia-buenos-aires/data/hoy.json (Buenos Aires) y guia-buenos-aires/data/hoy-berlin.json (Berlín).
# Si la agenda de una ciudad falla, la otra se actualiza igual.
# Ojo: GitHub apaga los pasos programados de un repositorio que pasa 60 días sin cambios hechos por una persona.
name: Actualizar agenda de hoy (guía)
on:
  schedule:
    - cron: "0 9 * * *"    # 6 de la mañana en Buenos Aires, 10 u 11 en Berlín
    - cron: "0 18 * * *"   # 3 de la tarde en Buenos Aires, 19 o 20 en Berlín
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hoy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar la agenda de Buenos Aires
        continue-on-error: true
        shell: pwsh
        run: ./herramientas/armar-hoy.ps1 -out guia-buenos-aires/data/hoy.json
      - name: Bajar la agenda de Berlín
        continue-on-error: true
        shell: pwsh
        run: ./herramientas/armar-hoy-berlin.ps1 -out guia-buenos-aires/data/hoy-berlin.json
      - name: Subir si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guia-buenos-aires/data/hoy.json guia-buenos-aires/data/hoy-berlin.json
          git diff --cached --quiet || (git commit -m "Agenda de hoy" && git push)
